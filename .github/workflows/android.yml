name: APK bauen

# Dieser Workflow kann zwei Dinge:
#  - apk-bauen: baut die APK (läuft auch automatisch bei jeder Änderung auf main)
#  - schluessel-erzeugen: erzeugt EINMALIG den Signaturschlüssel. Ein zweiter Lauf erzeugt einen ANDEREN Schlüssel.

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: 'Was soll passieren?'
        type: choice
        default: apk-bauen
        options:
          - apk-bauen
          - schluessel-erzeugen
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schluessel:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.aktion == 'schluessel-erzeugen'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Schlüssel erzeugen
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Artikelarchiv, O=Privat, C=CH"
          base64 -w0 debug.keystore > schluessel.txt

      - name: Schlüssel bereitstellen (1 Tag verfügbar)
        uses: actions/upload-artifact@v7
        with:
          name: schluessel
          path: schluessel.txt
          retention-days: 1

  apk:
    if: github.event_name == 'push' || github.event.inputs.aktion == 'apk-bauen'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Web-Dateien bereitstellen
        run: |
          mkdir -p www
          cp index.html www/index.html
          test -f node_modules/@mozilla/readability/Readability.js || { echo "::error::Readability.js fehlt im Paket"; ls node_modules/@mozilla/readability; exit 1; }
          cp node_modules/@mozilla/readability/Readability.js www/Readability.js

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Teilen-Menü im Android-Manifest freischalten
        run: |
          python3 - <<'PY'
          import re, sys
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          flt = '''
              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="text/plain" />
              </intent-filter>

          '''
          if 'android.intent.action.SEND' not in s:
              i = s.index('</activity>')
              s = s[:i] + flt + '        ' + s[i:]
          m = re.search(r'<activity\b[^>]*>', s)
          tag = m.group(0)
          if 'android:launchMode' not in tag:
              s = s.replace(tag, tag[:-1] + ' android:launchMode="singleTask">', 1)
          if 'android.permission.INTERNET' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>')
          for needle in ['android.intent.action.SEND"', 'android:launchMode', 'android.permission.INTERNET']:
              if needle not in s:
                  print('FEHLT:', needle)
                  sys.exit(1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Festen Signaturschlüssel einsetzen
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Das Secret KEYSTORE_B64 fehlt. Siehe Anleitung zum Signaturschlüssel."
            exit 1
          fi
          KS_PATH="$RUNNER_TEMP/fest.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
          echo "KS_PATH=$KS_PATH" >> "$GITHUB_ENV"
          # Gradle ausdrücklich anweisen, diesen Schlüssel für das Debug-Signieren zu verwenden
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          echo "Ende von android/app/build.gradle:"
          tail -n 15 android/app/build.gradle

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Signatur der APK prüfen
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          KS_FP=$(keytool -list -v -keystore "$KS_PATH" -storepass android | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          APK_FP=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | sed 's/.*: *//' | tr -d ' ' | tr 'A-Z' 'a-z')
          echo "Fingerabdruck des Schlüssels: $KS_FP"
          echo "Fingerabdruck der APK:        $APK_FP"
          if [ -z "$KS_FP" ] || [ "$KS_FP" != "$APK_FP" ]; then
            echo "::error::Die APK ist nicht mit dem festen Schlüssel signiert."
            exit 1
          fi

      - name: APK bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: artikelarchiv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
