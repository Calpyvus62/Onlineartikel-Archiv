<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artikelarchiv</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #EEF1F4;
  --paper: #FFFFFF;
  --ink: #1B2430;
  --muted: #5A6676;
  --line: #D5DBE2;
  --accent: #1D5C78;
  --accent-ink: #FFFFFF;
  --chip: #E3E8ED;
  --hl: rgba(255, 222, 64, 0.62);
  --ok: #1E7A4C;
  --warn: #9A5B00;
  --bad: #B3261E;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-read: "Noto Serif", Georgia, "Times New Roman", serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161C;
    --paper: #1A212A;
    --ink: #E7EBF0;
    --muted: #9AA6B4;
    --line: #2B3541;
    --accent: #6BB6D6;
    --accent-ink: #0E1A22;
    --chip: #232C37;
    --hl: rgba(255, 206, 40, 0.34);
    --ok: #5CCB96;
    --warn: #E3B05B;
    --bad: #FF8A80;
  }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-left, 0px)) 112px max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
h1, h2, h3, p, ul { margin: 0; }
h1 { font-size: 24px; line-height: 1.2; font-weight: 600; }
h1 .count, h3 span { color: var(--muted); font-weight: 400; font-size: 0.7em; }
h3 { font-size: 16px; font-weight: 600; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.add { display: flex; flex-direction: column; gap: 10px; }

input[type="text"], input[type="search"] {
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 11px 12px;
  width: 100%;
}
button {
  font: inherit;
  font-weight: 500;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 14px;
  min-height: 42px;
  cursor: pointer;
}
button.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.confirm { border-color: var(--bad); color: var(--bad); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.status {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.status.busy { border-left-color: var(--accent); }
.status.ok { border-left-color: var(--ok); }
.status.warn { border-left-color: var(--warn); }
.status.bad { border-left-color: var(--bad); }

.articles { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.card {
  width: 100%;
  text-align: left;
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-weight: 400;
}
.card-meta { font-size: 12.5px; color: var(--muted); }
.card-title { font-family: var(--font-read); font-size: 18px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.card-excerpt {
  font-size: 14px; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-chips { font-size: 12.5px; color: var(--accent); }

.reader-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.orig { font-size: 14px; color: var(--accent); }
.paper {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 18px 16px 8px;
}
.paper .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.paper h2 {
  font-family: var(--font-read);
  font-size: 24px; line-height: 1.25; font-weight: 600;
  margin: 6px 0 14px;
  overflow-wrap: anywhere;
}
.prose {
  font-family: var(--font-read);
  font-size: 18px; line-height: 1.65;
  overflow-wrap: anywhere;
}
.prose p { margin: 0 0 1em; }
.prose h1, .prose h2, .prose h3, .prose h4 { font-family: var(--font-ui); line-height: 1.25; margin: 1.4em 0 0.5em; }
.prose h1 { font-size: 1.35em; } .prose h2 { font-size: 1.25em; } .prose h3, .prose h4 { font-size: 1.1em; }
.prose img { max-width: 100%; height: auto; display: block; margin: 0.8em auto; border-radius: 4px; }
.prose figure { margin: 1em 0; }
.prose figcaption { font-family: var(--font-ui); font-size: 13px; color: var(--muted); }
.prose blockquote { margin: 1em 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
.prose a { color: var(--accent); }
.prose pre, .prose code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85em; }
.prose pre { overflow-x: auto; background: var(--chip); padding: 10px; border-radius: 4px; }
.prose table { display: block; overflow-x: auto; border-collapse: collapse; font-family: var(--font-ui); font-size: 14px; }
.prose td, .prose th { border: 1px solid var(--line); padding: 4px 8px; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0 0 1em; }
.noimg {
  display: block; margin: 0.8em 0; padding: 18px 12px; text-align: center;
  background: var(--chip); color: var(--muted); border-radius: 4px;
  font-family: var(--font-ui); font-size: 13px;
}
.noimg::before { content: "Bild nicht gespeichert"; }
::highlight(markierung) { background-color: var(--hl); }
mark.hl { background: var(--hl); color: inherit; border-radius: 2px; }

.section { display: flex; flex-direction: column; gap: 10px; }
ul.list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item {
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.quote {
  font-family: var(--font-read); font-size: 16px; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  background: linear-gradient(var(--hl), var(--hl)) no-repeat 0 100% / 100% 0.45em;
}
.item-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.how { font-size: 12.5px; color: var(--muted); }
.how.lost { color: var(--bad); }
.actions { display: flex; gap: 8px; }

.kvs { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--muted); flex: none; }
.kv .v { text-align: right; overflow-wrap: anywhere; }
.log {
  margin: 0; padding: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
}

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.bar .label { font-size: 14px; color: var(--muted); min-width: 0; }
.bar .label.done { color: var(--ok); font-weight: 600; }
.bar button { flex: none; min-width: 120px; }

</style>
</head>
<body>
<div class="wrap" id="view-list">
  <header class="top">
    <div class="top-row">
      <h1>Artikelarchiv <span class="count" id="count"></span></h1>
      <button id="info-btn" class="small" aria-label="Informationen und Protokoll">Info</button>
    </div>
  </header>

  <section class="add">
    <label for="url" class="kicker">Artikel speichern</label>
    <input type="text" id="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Link hier einfügen">
    <div class="row">
      <button id="save" class="primary">Speichern</button>
      <button id="paste">Aus Zwischenablage</button>
    </div>
    <p class="hint">Oder in einer anderen App «Teilen» wählen und dieses Archiv antippen.</p>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  </section>

  <ul class="articles" id="articles"></ul>
  <p class="hint" id="empty" hidden>Noch kein Artikel gespeichert.</p>
</div>

<div class="wrap" id="view-reader" hidden>
  <div class="reader-top">
    <button id="back" class="small">‹ Zurück</button>
    <a id="r-orig" class="orig" href="#">Original öffnen</a>
  </div>
  <article class="paper">
    <p class="meta" id="r-meta"></p>
    <h2 id="r-title"></h2>
    <div class="prose" id="body"></div>
  </article>

  <section class="section">
    <h3>Markierungen <span id="hl-count"></span></h3>
    <input type="search" id="q" placeholder="In Markierungen suchen" autocomplete="off">
    <ul class="list" id="hl-list"></ul>
    <p class="hint" id="hl-empty"></p>
  </section>

  <section class="section">
    <button id="del-article">Artikel löschen</button>
  </section>
</div>

<div class="wrap" id="view-info" hidden>
  <div class="reader-top">
    <button id="info-back" class="small">‹ Zurück</button>
  </div>
  <h1>Info</h1>
  <div id="info-body" class="kvs"></div>
  <section class="section">
    <h3>Protokoll</h3>
    <pre id="log" class="log"></pre>
    <div class="row"><button id="log-copy">Protokoll kopieren</button></div>
  </section>
</div>

<div class="bar" id="bar" hidden>
  <span class="label" id="sel" aria-live="polite">Text auswählen, dann markieren</span>
  <button class="primary" id="mark" disabled>Markieren</button>
</div>
<script src="Readability.js"></script>
<script>
/* ===== anchor.js ===== */
// Anker-Logik: Markierungen im Text speichern und wiederfinden.
// Verfahren nach dem W3C Web Annotation Data Model:
// exakter Wortlaut + Text davor/danach (Quote) + Position (Offsets).
const Anchor = (function () {
  const CONTEXT = 32;

  function trimRange(text, s, e) {
    while (s < e && /\s/.test(text[s])) s++;
    while (e > s && /\s/.test(text[e - 1])) e--;
    return [s, e];
  }

  function makeSelector(text, start, end) {
    return {
      start: start,
      end: end,
      exact: text.slice(start, end),
      prefix: text.slice(Math.max(0, start - CONTEXT), start),
      suffix: text.slice(end, end + CONTEXT)
    };
  }

  function commonSuffix(a, b) {
    let n = 0;
    while (n < a.length && n < b.length && a[a.length - 1 - n] === b[b.length - 1 - n]) n++;
    return n;
  }

  function commonPrefix(a, b) {
    let n = 0;
    while (n < a.length && n < b.length && a[n] === b[n]) n++;
    return n;
  }

  function allIndices(text, needle) {
    const out = [];
    if (!needle) return out;
    let i = text.indexOf(needle);
    while (i !== -1) {
      out.push(i);
      i = text.indexOf(needle, i + 1);
    }
    return out;
  }

  // 0..1: wie gut passt die Umgebung an Position i zur gespeicherten Umgebung
  function contextScore(text, h, i) {
    const pre = text.slice(Math.max(0, i - h.prefix.length), i);
    const suf = text.slice(i + h.exact.length, i + h.exact.length + h.suffix.length);
    const total = h.prefix.length + h.suffix.length;
    if (total === 0) return 1;
    return (commonSuffix(h.prefix, pre) + commonPrefix(h.suffix, suf)) / total;
  }

  function normalize(text) {
    let out = '';
    const map = [];
    let prevSpace = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (/\s/.test(c)) {
        if (!prevSpace) {
          out += ' ';
          map.push(i);
          prevSpace = true;
        }
      } else {
        out += c;
        map.push(i);
        prevSpace = false;
      }
    }
    return { out: out, map: map };
  }

  function closest(list, target) {
    let best = list[0];
    for (const v of list) if (Math.abs(v - target) < Math.abs(best - target)) best = v;
    return best;
  }

  // Liefert {start, end, how} oder null, wenn die Stelle nicht mehr auffindbar ist.
  function anchor(text, h) {
    // 1) Position stimmt noch und die Umgebung passt
    if (text.slice(h.start, h.end) === h.exact && contextScore(text, h, h.start) >= 0.5) {
      return { start: h.start, end: h.end, how: 'Position' };
    }

    // 2) Wortlaut suchen, bei Mehrfachtreffern die Umgebung entscheiden lassen
    const idx = allIndices(text, h.exact);
    if (idx.length === 1) {
      return { start: idx[0], end: idx[0] + h.exact.length, how: 'Wortlaut' };
    }
    if (idx.length > 1) {
      let best = idx[0];
      let bestScore = -1;
      for (const i of idx) {
        const sc = contextScore(text, h, i);
        const better = sc > bestScore || (sc === bestScore && Math.abs(i - h.start) < Math.abs(best - h.start));
        if (better) {
          best = i;
          bestScore = sc;
        }
      }
      return { start: best, end: best + h.exact.length, how: 'Wortlaut + Umgebung' };
    }

    // 3) Wortlaut mit angepasstem Leerraum
    const nt = normalize(text);
    const nh = normalize(h.exact).out;
    const nIdx = allIndices(nt.out, nh);
    if (nIdx.length) {
      const origStarts = nIdx.map(i => nt.map[i]);
      const s = closest(origStarts, h.start);
      const ni = nIdx[origStarts.indexOf(s)];
      const e = nt.map[ni + nh.length - 1] + 1;
      return { start: s, end: e, how: 'Wortlaut (Leerraum angepasst)' };
    }

    // 4) Unscharf: Anfang und Ende der Markierung einzeln suchen
    const k = Math.min(24, Math.floor(h.exact.length / 2));
    if (k >= 10) {
      const head = h.exact.slice(0, k);
      const tail = h.exact.slice(-k);
      const heads = allIndices(text, head);
      const tails = allIndices(text, tail);
      let best = null;
      for (const hi of heads) {
        for (const ti of tails) {
          const end = ti + k;
          const len = end - hi;
          if (end <= hi) continue;
          if (len < h.exact.length * 0.5 || len > h.exact.length * 1.6) continue;
          const cost = Math.abs(len - h.exact.length) + Math.abs(hi - h.start) / 1000;
          if (!best || cost < best.cost) best = { start: hi, end: end, cost: cost };
        }
      }
      if (best) return { start: best.start, end: best.end, how: 'Anfang + Ende (unscharf)' };
    }

    return null;
  }

  return { makeSelector: makeSelector, trimRange: trimRange, anchor: anchor };
})();

if (typeof module !== 'undefined') module.exports = Anchor;


/* ===== sanitize.js ===== */
// Bereinigung von Artikel-HTML nach dem Erlaubnislisten-Prinzip.
// Es werden ausschliesslich neue, harmlose Elemente aufgebaut. Nichts aus der
// Quelle wird übernommen, ausser dem Text und wenigen geprüften Attributen.
// Kein innerHTML auf dem lebenden Dokument, keine Event-Attribute, keine Styles.
const Sanitize = (function () {
  const ALLOWED = new Set([
    'p', 'br', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol', 'li', 'blockquote', 'pre', 'code',
    'em', 'strong', 'b', 'i', 'u', 's', 'del', 'ins', 'sub', 'sup', 'a', 'img', 'figure',
    'figcaption', 'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td', 'caption', 'hr', 'div',
    'span', 'section', 'article', 'small', 'cite', 'q', 'abbr', 'time', 'dl', 'dt', 'dd', 'mark',
    'kbd', 'samp', 'var', 'wbr', 'address'
  ]);
  // Wird samt Inhalt verworfen
  const DROP = new Set([
    'script', 'style', 'noscript', 'iframe', 'frame', 'frameset', 'object', 'embed', 'applet',
    'form', 'input', 'button', 'select', 'textarea', 'option', 'optgroup', 'svg', 'math', 'canvas',
    'video', 'audio', 'source', 'track', 'template', 'link', 'meta', 'base', 'title', 'head',
    'dialog', 'map', 'area', 'nav', 'aside', 'footer', 'header', 'menu', 'datalist', 'label',
    'fieldset', 'legend', 'slot', 'portal', 'param', 'bgsound', 'marquee'
  ]);
  const VOID = new Set(['br', 'hr', 'img', 'wbr']);
  const MAX_DEPTH = 120;

  function safeLink(raw, base) {
    if (!raw) return null;
    let u;
    try { u = new URL(String(raw).trim(), base); } catch (e) { return null; }
    if (u.protocol === 'http:' || u.protocol === 'https:' || u.protocol === 'mailto:') return u.href;
    return null;
  }

  const DATA_IMG = /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+/=\s]+$/i;

  function imageSource(el, base) {
    const cands = [
      el.getAttribute('src'),
      el.getAttribute('data-src'),
      el.getAttribute('data-original'),
      el.getAttribute('data-lazy-src')
    ];
    for (const c of cands) {
      if (!c) continue;
      const s = String(c).trim();
      if (DATA_IMG.test(s) && s.length < 3000000) return s;
      try {
        const u = new URL(s, base);
        if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
      } catch (e) { /* nächster Kandidat */ }
    }
    return null;
  }

  function isTiny(el) {
    const w = parseInt(el.getAttribute('width'), 10);
    const h = parseInt(el.getAttribute('height'), 10);
    return (w > 0 && w <= 2) || (h > 0 && h <= 2);
  }

  function walk(src, out, ctx, depth) {
    if (depth > MAX_DEPTH) return;
    for (let n = src.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3) {
        out.appendChild(document.createTextNode(n.nodeValue));
        continue;
      }
      if (n.nodeType !== 1) continue;
      if (n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml') continue;
      const tag = n.localName;
      if (DROP.has(tag)) continue;
      if (!ALLOWED.has(tag)) { // unbekannt: Inhalt behalten, Hülle weglassen
        walk(n, out, ctx, depth + 1);
        continue;
      }
      if (tag === 'img') {
        if (isTiny(n)) continue;
        const el = document.createElement('img');
        if (ctx.mode === 'render') {
          const i = parseInt(n.getAttribute('data-i'), 10);
          if (!(i >= 0)) continue;
          el.setAttribute('data-i', String(i));
        } else {
          const url = imageSource(n, ctx.base);
          if (!url) continue;
          let i = ctx.index.get(url);
          if (i === undefined) {
            i = ctx.images.length;
            ctx.images.push(url);
            ctx.index.set(url, i);
          }
          el.setAttribute('data-i', String(i));
        }
        const alt = n.getAttribute('alt');
        if (alt) el.setAttribute('alt', alt.slice(0, 300));
        out.appendChild(el);
        continue;
      }
      const el = document.createElement(tag);
      if (tag === 'a') {
        const href = safeLink(n.getAttribute('href'), ctx.base);
        if (href) {
          el.setAttribute('href', href);
          el.setAttribute('target', '_blank');
          el.setAttribute('rel', 'noopener noreferrer nofollow');
        }
      } else if (tag === 'td' || tag === 'th') {
        const cs = parseInt(n.getAttribute('colspan'), 10);
        const rs = parseInt(n.getAttribute('rowspan'), 10);
        if (cs > 1 && cs < 50) el.setAttribute('colspan', String(cs));
        if (rs > 1 && rs < 200) el.setAttribute('rowspan', String(rs));
      }
      if (!VOID.has(tag)) walk(n, el, ctx, depth + 1);
      out.appendChild(el);
    }
  }

  // html: Zeichenkette. Optionen: base (URL für relative Adressen),
  // mode 'ingest' (aus dem Netz: Bilder werden gesammelt) oder 'render' (gespeichert: data-i bleibt).
  // Ergebnis: { el: <div> mit bereinigten Kindern, images: [absolute URLs] }
  function run(html, opts) {
    opts = opts || {};
    const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
    const out = document.createElement('div');
    const ctx = {
      base: opts.base || 'about:blank',
      mode: opts.mode || 'ingest',
      images: [],
      index: new Map()
    };
    walk(doc.body || doc.documentElement, out, ctx, 0);
    return { el: out, images: ctx.images };
  }

  return { run: run, safeLink: safeLink };
})();

if (typeof module !== 'undefined') module.exports = Sanitize;


/* ===== extract.js ===== */
// Artikeltext aus einer Webseite gewinnen.
// 1. Wahl: Mozilla Readability (wird als eigene Datei dazugeladen, falls vorhanden).
// 2. Wahl: einfacher eigener Extraktor, falls Readability fehlt oder nichts findet.
const Extract = (function () {
  const MIN_TEXT = 200;

  function parseDoc(html, url) {

    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

  }

    if (b.length < 12) return null;
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image/png';
    if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'image/jpeg';
    if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x38) return 'image/gif';
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
    if (b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70 && b[8] === 0x61 && b[9] === 0x76 && b[10] === 0x69 && b[11] === 0x66) return 'image/avif';
    const head = new TextDecoder().decode(b.subarray(0, Math.min(b.length, 400))).toLowerCase();

    return null;
  }

    const p = plugin();
    if (isNative() && p && typeof p.request === 'function') {
      return p.request(opts);
    }
    return null; // kein nativer Dienst
  }

  async function getText(url) {
    if (window.__NET_TEST__) return window.__NET_TEST__.getText(url);
    let cur = url;
    for (let hop = 0; hop < 6; hop++) {
      let res = await request({
        url: cur,
        method: 'GET',
        headers: { 'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.5', 'Accept-Language': 'de-CH,de;q=0.9,en;q=0.7' },
        responseType: 'text',
        connectTimeout: 15000,
        readTimeout: 25000
      });
      let status, data, headers, finalUrl;
      if (res) {
        status = res.status; data = res.data; headers = res.headers; finalUrl = res.url || cur;
      } else { // Entwicklungs-Browser ohne nativen Dienst

      if (typeof data !== 'string') throw new Error('Unerwartete Antwort der Seite.');
      if (data.length > MAX_HTML) throw new Error('Die Seite ist zu gross.');

    throw new Error('Zu viele Weiterleitungen.');

  async function getImage(url, referer) {

})();

/* ===== store.js ===== */
// Lokaler Speicher (IndexedDB). Vier Ablagen:
//  articles   Metadaten (klein, für die Liste)
//  bodies     bereinigtes Artikel-HTML
//  images     Bilder als Blob, Schlüssel "<artikel>:<nr>"
//  highlights Markierungen
const Store = (function () {
  const DB = 'artikelarchiv';
  const VERSION = 1;
  let dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (resolve, reject) {
      const req = indexedDB.open(DB, VERSION);
      req.onupgradeneeded = function () {
        const db = req.result;
        const a = db.createObjectStore('articles', { keyPath: 'id' });
        a.createIndex('savedAt', 'savedAt');
        a.createIndex('url', 'url');
        db.createObjectStore('bodies', { keyPath: 'id' });
        const im = db.createObjectStore('images', { keyPath: 'key' });
        im.createIndex('articleId', 'articleId');
        const h = db.createObjectStore('highlights', { keyPath: 'id' });
        h.createIndex('articleId', 'articleId');
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('Speicher nicht verfügbar')); };
      req.onblocked = function () { reject(new Error('Speicher blockiert')); };
    });
    return dbp;
  }

  function wrap(req) {
    return new Promise(function (res, rej) {
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
  }

  // Führt fn(stores) in einer Transaktion aus; fertig, wenn die Transaktion abgeschlossen ist.
  async function tx(names, mode, fn) {
    const db = await open();
    return new Promise(function (resolve, reject) {
      const t = db.transaction(names, mode);
      const stores = {};
      names.forEach(function (n) { stores[n] = t.objectStore(n); });
      let result;
      t.oncomplete = function () { resolve(result); };
      t.onerror = function () { reject(t.error); };
      t.onabort = function () { reject(t.error || new Error('Speichern abgebrochen')); };
      try {
        Promise.resolve(fn(stores)).then(function (r) { result = r; }, function (e) { try { t.abort(); } catch (x) { /* schon beendet */ } reject(e); });
      } catch (e) {
        try { t.abort(); } catch (x) { /* schon beendet */ }
        reject(e);
      }
    });
  }

  function newId(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // Artikel samt Text und Bildern in einem Zug ablegen: ganz oder gar nicht.
  async function saveArticle(meta, bodyHtml, images) {
    await tx(['articles', 'bodies', 'images'], 'readwrite', function (s) {
      s.articles.put(meta);
      s.bodies.put({ id: meta.id, html: bodyHtml });
      images.forEach(function (im) {
        s.images.put({ key: meta.id + ':' + im.i, articleId: meta.id, i: im.i, type: im.type, blob: im.blob });
      });
    });
  }

  async function listArticles() {
    const db = await open();
    const all = await wrap(db.transaction('articles').objectStore('articles').getAll());
    all.sort(function (a, b) { return b.savedAt - a.savedAt; });
    return all;
  }
  async function getArticle(id) {
    const db = await open();
    const t = db.transaction(['articles', 'bodies']);
    const meta = await wrap(t.objectStore('articles').get(id));
    const body = await wrap(t.objectStore('bodies').get(id));
    return meta && body ? { meta: meta, html: body.html } : null;
  }
  async function findByUrl(url) {
    const db = await open();
    const list = await wrap(db.transaction('articles').objectStore('articles').index('url').getAll(url));
    return list[0] || null;
  }
  async function getImages(id) {
    const db = await open();
    return wrap(db.transaction('images').objectStore('images').index('articleId').getAll(id));
  }
  async function deleteArticle(id) {
    await tx(['articles', 'bodies', 'images', 'highlights'], 'readwrite', async function (s) {
      s.articles.delete(id);
      s.bodies.delete(id);
      const ik = await wrap(s.images.index('articleId').getAllKeys(id));
      ik.forEach(function (k) { s.images.delete(k); });
      const hk = await wrap(s.highlights.index('articleId').getAllKeys(id));
      hk.forEach(function (k) { s.highlights.delete(k); });
    });
  }

  async function highlightsOf(id) {
    const db = await open();
    const list = await wrap(db.transaction('highlights').objectStore('highlights').index('articleId').getAll(id));
    list.sort(function (a, b) { return a.start - b.start; });
    return list;
  }
  async function allHighlightCounts() {
    const db = await open();
    const all = await wrap(db.transaction('highlights').objectStore('highlights').getAll());
    const m = {};
    all.forEach(function (h) { m[h.articleId] = (m[h.articleId] || 0) + 1; });
    return m;
  }
  async function putHighlight(h) {
    await tx(['highlights'], 'readwrite', function (s) { s.highlights.put(h); });
  }
  async function deleteHighlight(id) {
    await tx(['highlights'], 'readwrite', function (s) { s.highlights.delete(id); });
  }

  async function stats() {
    const db = await open();
    const t = db.transaction(['articles', 'images', 'highlights']);
    const out = {
      articles: await wrap(t.objectStore('articles').count()),
      images: await wrap(t.objectStore('images').count()),
      highlights: await wrap(t.objectStore('highlights').count())

    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        out.usage = e.usage; out.quota = e.quota;
      }
    } catch (e) { /* nicht verfügbar */ }

  }
  async function persist() {
    try {
      if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist();
    } catch (e) { /* ignorieren */ }
    return false;
  }

  return {
    open: open, newId: newId, saveArticle: saveArticle, listArticles: listArticles, getArticle: getArticle,
    findByUrl: findByUrl, getImages: getImages, deleteArticle: deleteArticle, highlightsOf: highlightsOf,
    allHighlightCounts: allHighlightCounts, putHighlight: putHighlight, deleteHighlight: deleteHighlight,
    stats: stats, persist: persist
  };
})();

    }

    setStatus('Bereite Text auf …', 'busy');
    var art = Extract.extract(page.html, page.url || url);
    log('Text über ' + art.via + ': ' + art.text.length + ' Zeichen, ' + art.images.length + ' Bilder');

    var id = Store.newId('a');
    var urls = art.images.slice(0, MAX_IMAGES);
    var done = 0, total = 0, failed = 0, reasons = {};
    var saved = [];
    if (urls.length) setStatus('Lade Bilder 0/' + urls.length + ' …', 'busy');
    await mapLimit(urls, 4, async function (u, i) {
      try {
        var r;
        if (u.slice(0, 5) === 'data:') {
          var bytes = Net.b64ToBytes(u);
          var type = Net.sniff(bytes);
          if (!type) throw new Error('Format unbekannt');
          r = { blob: new Blob([bytes], { type: type }), type: type };
        } else {
          r = await Net.getImage(u, page.url || url);
        }
        if (total + r.blob.size > MAX_TOTAL) throw new Error('Speichergrenze für diesen Artikel erreicht');
        total += r.blob.size;
        saved.push({ i: i, type: r.type, blob: r.blob });
      } catch (e) {
        failed++;
        var why = (e && e.message) || 'Fehler';
        reasons[why] = (reasons[why] || 0) + 1;
        log('Bild ' + i + ' nicht geladen: ' + why);
      }
      done++;
      setStatus('Lade Bilder ' + done + '/' + urls.length + ' …', 'busy');
    });

    var meta = {
      id: id,
      url: key,
      finalUrl: page.url || url,
      title: art.title,
      byline: art.byline,
      site: art.site,
      lang: art.lang,
      dir: art.dir,
      published: art.published,
      excerpt: art.excerpt,
      savedAt: Date.now(),
      chars: art.text.length,
      imageTotal: art.images.length,
      imageSaved: saved.length,
      via: art.via
    };
    await Store.saveArticle(meta, art.html, saved);
    log('Gespeichert ' + id + ' mit ' + saved.length + ' Bildern');
    await renderList();
    var note = '';
    if (art.images.length > urls.length) note = ' (nur die ersten ' + MAX_IMAGES + ' Bilder)';
    if (failed) {
      var top = Object.keys(reasons).sort(function (a, b) { return reasons[b] - reasons[a]; })[0];
      note += ' · ' + failed + ' Bild' + (failed === 1 ? '' : 'er') + ' nicht geladen (' + top + ')';
    }
    setStatus('Gespeichert: ' + meta.title + note, failed ? 'warn' : 'ok', { label: 'Öffnen', run: function () { openArticle(id, true); } });
    $('url').value = '';
  }

  function alreadySaved(rec) {
    setStatus('Schon gespeichert: ' + rec.title, 'warn', { label: 'Öffnen', run: function () { openArticle(rec.id, true); } });
    $('url').value = '';
  }

  /* ---------- Leseansicht ---------- */
  var root = $('body');
  var markBtn = $('mark');
  var selLabel = $('sel');
  var bar = $('bar');
  var hasApi = typeof CSS !== 'undefined' && CSS.highlights && typeof Highlight !== 'undefined';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = [];
  var resolved = [];

  function revokeUrls() {
    if (current && current.urls) current.urls.forEach(function (u) { URL.revokeObjectURL(u); });
  }

  async function openArticle(id, push) {
    try {
      var rec = await Store.getArticle(id);
      if (!rec) { setStatus('Artikel nicht gefunden.', 'bad'); return; }
      var imgs = await Store.getImages(id);
      revokeUrls();
      current = { meta: rec.meta, urls: [] };
      var m = rec.meta;

      $('r-title').textContent = m.title;
      var parts = [m.site, m.byline, fmtDate(m.savedAt)].filter(Boolean);
      $('r-meta').textContent = parts.join(' · ');
      var link = $('r-orig');
      link.setAttribute('href', m.finalUrl || m.url);
      link.setAttribute('rel', 'noopener noreferrer');
      link.setAttribute('target', '_blank');
      root.dir = m.dir || 'auto';
      if (m.lang) root.lang = m.lang; else root.removeAttribute('lang');

      clear(root);
      var res = Sanitize.run(rec.html, { mode: 'render', base: m.finalUrl || m.url });
      while (res.el.firstChild) root.appendChild(res.el.firstChild);
      var byIndex = {};
      imgs.forEach(function (im) { byIndex[im.i] = im; });
      root.querySelectorAll('img[data-i]').forEach(function (img) {
        var im = byIndex[img.getAttribute('data-i')];
        if (im) {
          var u = URL.createObjectURL(im.blob);
          current.urls.push(u);
          img.decoding = 'async';
          img.src = u;
        } else {
          var ph = h('span', { class: 'noimg', role: 'img', 'aria-label': img.getAttribute('alt') || 'Bild nicht gespeichert' });
          img.replaceWith(ph);
        }
      });

      items = await Store.highlightsOf(id);
      show('reader');
      render();
      resetDelete();
      if (push) history.pushState({ v: 'reader', id: id }, '');
    } catch (e) {
      log('Öffnen fehlgeschlagen: ' + (e && e.message));
      setStatus('Artikel lässt sich nicht öffnen: ' + (e && e.message), 'bad');
    }
  }

  function closeReader() {
    revokeUrls();
    current = null;
    clearPaint();
    clear(root);
    items = [];
    show('list');
    renderList();
  }

  function textOffset(node, offset) {
    var r = document.createRange();
    r.selectNodeContents(root);
    r.setEnd(node, offset);
    return r.toString().length;
  }
  function rangeAt(s, e) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var pos = 0, startNode, startOff, endNode, endOff, n;
    while ((n = walker.nextNode())) {
      var len = n.nodeValue.length;
      if (startNode === undefined && s < pos + len) { startNode = n; startOff = s - pos; }
      if (startNode !== undefined && e <= pos + len) { endNode = n; endOff = e - pos; break; }
      pos += len;
    }
    if (!startNode || !endNode) return null;
    var r = document.createRange();
    r.setStart(startNode, startOff);
    r.setEnd(endNode, endOff);
    return r;
  }
  function wrapRange(range) {
    var scope = range.commonAncestorContainer;
    if (scope.nodeType === 3) scope = scope.parentNode;
    var w = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT);
    var nodes = [], n;
    while ((n = w.nextNode())) if (range.intersectsNode(n)) nodes.push(n);
    nodes.forEach(function (node) {
      var r = document.createRange();
      r.selectNodeContents(node);
      if (node === range.startContainer) r.setStart(node, range.startOffset);
      if (node === range.endContainer) r.setEnd(node, range.endOffset);
      if (r.collapsed) return;
      var mk = document.createElement('mark');
      mk.className = 'hl';
      r.surroundContents(mk);
    });
  }
  function clearPaint() {
    if (hasApi) CSS.highlights.delete('markierung');
    else {
      root.querySelectorAll('mark.hl').forEach(function (mk) {
        var p = mk.parentNode;
        while (mk.firstChild) p.insertBefore(mk.firstChild, mk);
        p.removeChild(mk);
        p.normalize();
      });
    }
  }
  function paint(found) {
    clearPaint();
    if (hasApi) {
      if (!found.length) return;
      var hl = new Highlight();
      found.forEach(function (f) {
        var r = rangeAt(f.a.start, f.a.end);
        if (r) hl.add(r);
      });
      CSS.highlights.set('markierung', hl);
    } else {
      found.forEach(function (f) {
        var r = rangeAt(f.a.start, f.a.end);
        if (r) wrapRange(r);
      });
    }
  }

  function render() {
    var text = root.textContent;
    resolved = items.map(function (it) { return { h: it, a: Anchor.anchor(text, it) }; });
    paint(resolved.filter(function (x) { return x.a; }));
    renderHighlights();
  }

  function twoStep(btn, idleLabel, action) {
    var timer = null;
    function reset() {
      if (timer) clearTimeout(timer);
      timer = null;
      btn.textContent = idleLabel;
      btn.classList.remove('confirm');
    }
    btn.addEventListener('click', function () {
      if (timer) { reset(); action(); }
      else {
        btn.textContent = 'Sicher? Nochmal tippen';
        btn.classList.add('confirm');
        timer = setTimeout(reset, 3000);
      }
    });
    return reset;
  }

  function renderHighlights() {
    var q = $('q').value.trim().toLowerCase();
    var ul = $('hl-list');
    clear(ul);
    var shown = resolved.filter(function (x) { return !q || x.h.exact.toLowerCase().indexOf(q) !== -1; });
    $('hl-count').textContent = resolved.length ? '(' + resolved.length + ')' : '';
    var empty = $('hl-empty');
    empty.hidden = shown.length > 0;
    empty.textContent = resolved.length
      ? 'Keine Markierung enthält diesen Suchbegriff.'
      : 'Noch keine Markierung. Wähle im Text eine Stelle aus und tippe unten auf «Markieren».';
    shown.forEach(function (x) {
      var showBtn = h('button', { text: 'Zeigen' });
      if (!x.a) showBtn.disabled = true;
      showBtn.addEventListener('click', function () {
        var r = x.a && rangeAt(x.a.start, x.a.end);
        if (!r) return;
        var top = r.getBoundingClientRect().top + window.scrollY - 140;
        window.scrollTo({ top: Math.max(0, top), behavior: reduce ? 'auto' : 'smooth' });
      });
      var del = h('button', { text: 'Löschen' });
      twoStep(del, 'Löschen', async function () {
        await Store.deleteHighlight(x.h.id);
        items = items.filter(function (it) { return it.id !== x.h.id; });
        render();
      });
      ul.appendChild(h('li', { class: 'item' },
        h('div', { class: 'quote', text: x.h.exact }),
        h('div', { class: 'item-foot' },
          h('span', { class: 'how' + (x.a ? '' : ' lost'), text: x.a ? 'Gefunden über: ' + x.a.how : 'Im Text nicht mehr auffindbar' }),
          h('span', { class: 'actions' }, showBtn, del))));
    });
  }

  /* Auswahl */
  var pending = null;
  var barTouched = false;
  var doneTimer = null;
  function setPending(p) {
    pending = p;
    markBtn.disabled = !p;
    if (doneTimer) return;
    selLabel.className = 'label';
    selLabel.textContent = p ? (p.e - p.s) + ' Zeichen ausgewählt' : 'Text auswählen, dann markieren';
  }
  document.addEventListener('selectionchange', function () {
    if (views.reader.hidden) return;
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { if (!barTouched) setPending(null); return; }
    var r = sel.getRangeAt(0);
    if (!root.contains(r.commonAncestorContainer)) { if (!barTouched) setPending(null); return; }
    var text = root.textContent;
    var se = Anchor.trimRange(text, textOffset(r.startContainer, r.startOffset), textOffset(r.endContainer, r.endOffset));
    if (se[1] - se[0] < 2) { if (!barTouched) setPending(null); return; }
    setPending({ s: se[0], e: se[1] });
  });
  function touch() { barTouched = true; setTimeout(function () { barTouched = false; }, 700); }
  bar.addEventListener('pointerdown', function (e) { touch(); e.preventDefault(); });
  bar.addEventListener('mousedown', function (e) { e.preventDefault(); });

  markBtn.addEventListener('click', async function () {
    if (!pending || !current) return;
    var text = root.textContent;
    var sel = Anchor.makeSelector(text, pending.s, pending.e);
    var dup = items.some(function (it) { return it.start === sel.start && it.end === sel.end && it.exact === sel.exact; });
    if (!dup) {
      sel.id = Store.newId('h');
      sel.articleId = current.meta.id;
      sel.created = Date.now();
      await Store.putHighlight(sel);
      items.push(sel);
    }
    var s = window.getSelection();
    if (s) s.removeAllRanges();
    pending = null;
    markBtn.disabled = true;
    render();
    selLabel.className = 'label done';
    selLabel.textContent = dup ? 'Schon markiert' : 'Markiert';
    if (doneTimer) clearTimeout(doneTimer);
    doneTimer = setTimeout(function () { doneTimer = null; setPending(pending); }, 1600);
  });
  $('q').addEventListener('input', renderHighlights);

  // Artikel löschen (zweistufig)
  var resetDelete = twoStep($('del-article'), 'Artikel löschen', async function () {
    if (!current) return;
    var id = current.meta.id;
    await Store.deleteArticle(id);
    log('Artikel gelöscht ' + id);
    history.back();
  });

  /* ---------- Info ---------- */
  async function renderInfo() {
    var st = await Store.stats();
    var box = $('info-body');
    clear(box);
    var plugins = [];
    try { plugins = Object.keys((window.Capacitor && window.Capacitor.Plugins) || {}); } catch (e) { /* leer */ }
    var rows = [
      ['Version', VERSION],
      ['Läuft als App', Net.isNative() ? 'ja' : 'nein (Browser)'],
      ['HTTP-Dienst', Net.plugin() ? 'vorhanden' : 'fehlt'],
      ['Teilen-Plugin', sharePlugin() ? 'vorhanden' : 'fehlt'],
      ['Readability', typeof Readability === 'function' ? 'geladen' : 'fehlt (Ersatzverfahren aktiv)'],
      ['Highlight-API', hasApi ? 'vorhanden' : 'Ersatzdarstellung'],
      ['Artikel', String(st.articles)],
      ['Bilder', String(st.images)],
      ['Markierungen', String(st.highlights)],
      ['Speicher belegt', st.usage != null ? fmtBytes(st.usage) + ' von ' + fmtBytes(st.quota) : 'unbekannt']
    ];
    rows.forEach(function (r) {
      box.appendChild(h('div', { class: 'kv' }, h('span', { class: 'k', text: r[0] }), h('span', { class: 'v', text: r[1] })));
    });
    box.appendChild(h('div', { class: 'kv' }, h('span', { class: 'k', text: 'Plugins' }), h('span', { class: 'v', text: plugins.join(', ') || '–' })));
    $('log').textContent = logLines.length ? logLines.join('\n') : '(leer)';
  }

  /* ---------- Teilen-Menü ---------- */
  function sharePlugin() {
    var P = window.Capacitor && window.Capacitor.Plugins;
    if (!P) return null;
    if (P.CapacitorShareTarget) return P.CapacitorShareTarget;
    var k = Object.keys(P).find(function (n) { return /share/i.test(n); });
    return k ? P[k] : null;
  }
  function onShared(ev) {
    try { log('Geteilt: ' + JSON.stringify(ev).slice(0, 400)); } catch (e) { /* ignorieren */ }
    var text = ((ev && ev.texts) || []).join(' ') + ' ' + ((ev && ev.title) || '');
    var u = extractUrl(text);
    if (!u) {
      show('list');
      setStatus('In dem geteilten Inhalt steckt kein Link.', 'bad');
      return;
    }
    if (history.state && history.state.v) { /* Ansicht bleibt im Verlauf */ }
    closeAnyView();
    enqueue(u);
  }
  function closeAnyView() {
    if (!views.list.hidden) return;
    revokeUrls();
    current = null;
    clearPaint();
    show('list');
    renderList();
  }
  function initShare() {
    var p = sharePlugin();
    if (!p || typeof p.addListener !== 'function') { log('Teilen-Plugin nicht gefunden'); return; }
    try {
      var r = p.addListener('shareReceived', onShared);
      if (r && r.then) r.then(function () { log('Teilen-Listener aktiv'); }, function (e) { log('Teilen-Listener Fehler: ' + (e && e.message)); });
    } catch (e) { log('Teilen-Listener Fehler: ' + (e && e.message)); }
  }

  /* ---------- Verdrahtung ---------- */
  $('save').addEventListener('click', function () {
    var v = $('url').value;
    if (!v.trim()) { setStatus('Bitte einen Link einfügen.', 'warn'); return; }
    enqueue(v);
  });
  $('url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('save').click(); }
  });
  $('paste').addEventListener('click', async function () {
    try {
      var t = await navigator.clipboard.readText();
      if (t) $('url').value = t.trim();
      else setStatus('Die Zwischenablage ist leer.', 'warn');
    } catch (e) {
      setStatus('Einfügen aus der Zwischenablage ist hier nicht erlaubt. Tippe ins Feld und halte gedrückt, dann «Einfügen» wählen.', 'warn');
    }
  });
  $('back').addEventListener('click', function () { history.back(); });
  $('info-btn').addEventListener('click', function () {
    show('info');
    renderInfo();
    history.pushState({ v: 'info' }, '');
  });
  $('info-back').addEventListener('click', function () { history.back(); });
  $('log-copy').addEventListener('click', async function () {
    try { await navigator.clipboard.writeText(logLines.join('\n')); $('log-copy').textContent = 'Kopiert'; }
    catch (e) { $('log-copy').textContent = 'Kopieren nicht möglich'; }
    setTimeout(function () { $('log-copy').textContent = 'Protokoll kopieren'; }, 2000);
  });

  window.addEventListener('popstate', function (e) {
    var s = e.state;
    if (s && s.v === 'reader') openArticle(s.id, false);
    else if (s && s.v === 'info') { show('info'); renderInfo(); }
    else if (!views.reader.hidden) closeReader();
    else { show('list'); renderList(); }
  });

  /* ---------- Start ---------- */
  (async function start() {
    // Nach einem Neuladen startet die App immer mit der Liste; ein alter Verlaufseintrag darf nicht in die Leseansicht zurückführen
    try { if (history.state) history.replaceState(null, ''); } catch (e) { /* ignorieren */ }
    try {
      await Store.open();
      Store.persist().then(function (ok) { log('Dauerhafter Speicher: ' + (ok ? 'ja' : 'nein/unbekannt')); });
      await renderList();
    } catch (e) {
      log('Speicher: ' + (e && e.message));
      setStatus('Der lokale Speicher ist nicht verfügbar: ' + (e && e.message), 'bad');
    }
    initShare();
    log('Start, Version ' + VERSION + ', nativ=' + Net.isNative());
    window.__app = { enqueue: enqueue, onShared: onShared, openArticle: openArticle, log: log }; // für Tests
  })();
})();

</script>
</body>
</html>
